<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D.LAB ONE - 통합 운영 플랫폼 프로토타입</title>
  <style>
    :root {
      /* ===== Apple-style dark palette ===== */
      --bg: #000000;
      --bg-elev: #0c0c0e;
      --panel: #1c1c1e;
      --panel-2: #2c2c2e;
      --panel-3: #3a3a3c;
      --ink: #f5f5f7;
      --ink-soft: #d6d6db;
      --muted: #98989f;
      --faint: #6c6c70;
      --line: rgba(255, 255, 255, .08);
      --line-strong: rgba(255, 255, 255, .14);

      --brand: #fa4616;
      --brand-soft: rgba(250, 70, 22, .14);
      --brand-ink: #ffffff;

      --blue: #0a84ff;
      --cyan: #64d2ff;
      --green: #30d158;
      --red: #ff453a;
      --violet: #bf5af2;
      --orange: #ff9f0a;
      --slate: #c4c4cc;

      --radius-xl: 22px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 9px;
      --shadow: 0 8px 30px rgba(0, 0, 0, .45);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
      --ease: cubic-bezier(.4, 0, .2, 1);
    }

    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      margin: 0; color: var(--ink);
      background:
        radial-gradient(900px 480px at 78% -8%, rgba(250, 70, 22, .07), transparent 60%),
        radial-gradient(760px 420px at 10% 0%, rgba(10, 132, 255, .06), transparent 55%),
        var(--bg);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.5; letter-spacing: -0.01em;
    }
    button, input, select, textarea { font: inherit; letter-spacing: inherit; }
    button { cursor: pointer; }
    ::selection { background: rgba(250, 70, 22, .28); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .24); background-clip: padding-box; }

    /* ===== ROLE SELECT ===== */
    .role-select-screen {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px;
    }
    .role-select-screen.hidden { display: none; }
    .role-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .role-logo-mark { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 16px; background: var(--brand); color: var(--brand-ink); font-weight: 800; font-size: 22px; box-shadow: 0 8px 24px rgba(250, 70, 22, .25); }
    .role-logo-text { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
    .role-subtitle { color: var(--muted); font-size: 16px; margin-bottom: 44px; letter-spacing: -0.01em; }
    .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; max-width: 900px; width: 100%; }
    .role-card {
      padding: 24px 22px; border: 1px solid var(--line); border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .02));
      cursor: pointer; transition: transform .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease); text-align: left;
    }
    .role-card:hover { border-color: var(--line-strong); transform: translateY(-4px); background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03)); }
    .role-icon { font-size: 30px; margin-bottom: 14px; }
    .role-card-title { font-size: 17px; font-weight: 650; margin-bottom: 6px; letter-spacing: -0.02em; }
    .role-card-desc { color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* ===== APP SHELL ===== */
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 256px 1fr; }
    .app-shell.hidden { display: none; }

    .rail {
      position: sticky; top: 0; height: 100vh; padding: 22px 14px;
      border-right: 1px solid var(--line); background: rgba(22, 22, 24, .72);
      backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); overflow-y: auto;
    }
    .brand { display: flex; gap: 11px; align-items: center; margin-bottom: 16px; padding: 0 4px; }
    .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--brand); color: var(--brand-ink); font-weight: 800; font-size: 18px; box-shadow: 0 4px 14px rgba(250, 70, 22, .22); }
    .brand-title { font-size: 16px; font-weight: 650; letter-spacing: -0.02em; }
    .brand-sub { color: var(--muted); font-size: 12px; margin-top: 1px; }

    .role-switch-btn {
      width: 100%; padding: 9px 12px; margin-bottom: 16px; border: 1px solid var(--line);
      border-radius: var(--radius-md); background: rgba(255, 255, 255, .04); color: var(--muted); font-size: 12.5px; font-weight: 600;
      display: flex; align-items: center; gap: 7px; transition: background .2s var(--ease), color .2s var(--ease);
    }
    .role-switch-btn:hover { background: rgba(255, 255, 255, .08); color: var(--ink); }

    .nav-group-label { margin: 18px 10px 8px; color: var(--faint); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .nav-btn {
      width: 100%; display: flex; align-items: center; gap: 11px; padding: 9px 11px; margin: 2px 0;
      border: 1px solid transparent; border-radius: var(--radius-md); background: transparent;
      color: var(--ink-soft); text-align: left; font-weight: 550; font-size: 14px; letter-spacing: -0.01em;
      transition: background .18s var(--ease), color .18s var(--ease);
    }
    .nav-btn:hover { background: rgba(255, 255, 255, .06); color: var(--ink); }
    .nav-btn.active { background: rgba(255, 255, 255, .09); color: var(--ink); }
    .nav-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: rgba(255, 255, 255, .06); font-size: 14px; transition: background .18s var(--ease); }
    .active .nav-icon { background: var(--brand); }

    .main { min-width: 0; }
    .topbar {
      position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center;
      gap: 16px; padding: 16px 30px; border-bottom: 1px solid var(--line);
      background: rgba(10, 10, 12, .68); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    }
    .page-title { font-size: 24px; margin: 0; letter-spacing: -0.03em; font-weight: 700; }
    .page-copy { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

    .content { padding: 26px 30px 56px; max-width: 1320px; }
    .view { display: none; animation: viewIn .4s var(--ease); }
    .view.active { display: block; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ===== COMPONENTS ===== */
    .select, .input, .textarea {
      border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: rgba(255, 255, 255, .04);
      color: var(--ink); outline: none; transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    }
    .select:focus, .input:focus, .textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .select { padding: 9px 11px; }
    .input { width: 100%; padding: 12px; }
    .textarea { width: 100%; min-height: 104px; padding: 12px; resize: vertical; line-height: 1.55; }
    ::placeholder { color: var(--faint); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 38px; padding: 9px 15px; border: 1px solid var(--line-strong); border-radius: var(--radius-md);
      background: rgba(255, 255, 255, .06); color: var(--ink); font-weight: 600; font-size: 13px; letter-spacing: -0.01em;
      transition: transform .14s var(--ease), background .18s var(--ease), border-color .18s var(--ease), opacity .18s var(--ease);
    }
    .btn:hover { background: rgba(255, 255, 255, .1); }
    .btn:active { transform: scale(.97); }
    .btn.primary { border-color: transparent; background: var(--brand); color: var(--brand-ink); font-weight: 650; box-shadow: 0 4px 16px rgba(250, 70, 22, .22); }
    .btn.primary:hover { background: #ff6a3d; }
    .btn.dark { background: var(--ink); color: #1d1d1f; border-color: transparent; font-weight: 650; }
    .btn.dark:hover { background: #ffffff; }
    .btn.green { background: rgba(48, 209, 88, .16); color: #4ade80; border-color: rgba(48, 209, 88, .28); }
    .btn.red { background: rgba(255, 69, 58, .16); color: #ff6b62; border-color: rgba(255, 69, 58, .28); }
    .btn.blue { background: rgba(10, 132, 255, .18); color: #4da3ff; border-color: rgba(10, 132, 255, .3); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.sm { min-height: 30px; padding: 5px 11px; font-size: 12px; border-radius: var(--radius-sm); }

    .grid { display: grid; gap: 14px; }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }

    .panel {
      border: 1px solid var(--line); border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .012));
      box-shadow: var(--shadow); overflow: hidden;
    }
    .panel.pad { padding: 18px; }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .panel-title { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
    .panel-sub { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .metric {
      display: grid; gap: 7px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .015)); min-height: 112px;
      transition: transform .25s var(--ease), border-color .25s var(--ease);
    }
    .metric:hover { transform: translateY(-2px); border-color: var(--line-strong); }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 600; }
    .metric-value { font-size: 30px; font-weight: 700; letter-spacing: -0.035em; }
    .metric-note { color: var(--muted); font-size: 12px; line-height: 1.45; }

    .tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px;
      border: 1px solid var(--line-strong); background: rgba(255, 255, 255, .06); color: var(--slate); font-size: 12px; font-weight: 600; white-space: nowrap; letter-spacing: -0.01em;
    }
    .tag.green { background: rgba(48, 209, 88, .15); color: #4ade80; border-color: rgba(48, 209, 88, .28); }
    .tag.blue { background: rgba(10, 132, 255, .16); color: #4da3ff; border-color: rgba(10, 132, 255, .3); }
    .tag.red { background: rgba(255, 69, 58, .15); color: #ff6b62; border-color: rgba(255, 69, 58, .28); }
    .tag.yellow { background: var(--brand-soft); color: var(--brand); border-color: rgba(250, 70, 22, .3); }
    .tag.violet { background: rgba(191, 90, 242, .16); color: #d08bff; border-color: rgba(191, 90, 242, .3); }
    .tag.orange { background: rgba(255, 159, 10, .16); color: #ffb340; border-color: rgba(255, 159, 10, .3); }

    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 16px; overflow-x: auto; }
    .tab { padding: 12px 14px; border: none; background: none; color: var(--muted); font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; transition: color .18s var(--ease); }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--ink); border-bottom-color: var(--brand); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--line); }
    th { font-weight: 600; color: var(--muted); font-size: 12px; background: rgba(255, 255, 255, .025); }
    tbody tr { transition: background .15s var(--ease); }
    tbody tr:hover { background: rgba(255, 255, 255, .03); }
    .table-wrap { overflow-x: auto; }

    .row-card { padding: 15px 18px; border-bottom: 1px solid var(--line); transition: background .15s var(--ease); }
    .row-card:last-child { border-bottom: 0; }
    .row-card:hover { background: rgba(255, 255, 255, .025); }
    .row-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .row-title { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
    .row-copy { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.5; }

    /* Score badge */
    .score { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; padding: 3px 9px; border-radius: 8px; background: rgba(48, 209, 88, .16); color: #4ade80; font-weight: 700; font-size: 13px; }
    .score.warn { background: var(--brand-soft); color: var(--brand); }
    .score.danger { background: rgba(255, 69, 58, .16); color: #ff6b62; }

    /* Toast */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: rgba(44, 44, 46, .92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: var(--ink); padding: 14px 22px; border-radius: var(--radius-md); font-weight: 600; font-size: 14px; z-index: 999; opacity: 0; transition: all .35s var(--ease); pointer-events: none; border: 1px solid var(--line-strong); box-shadow: var(--shadow); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Kiosk */
    .app-shell.kiosk-mode { grid-template-columns: 1fr; }
    .app-shell.kiosk-mode .rail { display: none; }
    .app-shell.kiosk-mode .content { padding-top: 12px; padding-bottom: 14px; }
    .kiosk { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 24px; align-items: start; }
    .kiosk-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .kiosk-key {
      aspect-ratio: 1.3; display: grid; place-items: center; border: 1px solid var(--line-strong);
      border-radius: var(--radius-md); background: rgba(255, 255, 255, .05); color: var(--ink); font-size: 22px; font-weight: 600;
      transition: transform .12s var(--ease), background .15s var(--ease);
    }
    .kiosk-key:hover { background: rgba(255, 255, 255, .1); }
    .kiosk-key:active { transform: scale(.95); }
    .kiosk-key.action { background: var(--brand); color: var(--brand-ink); border-color: transparent; font-size: 14px; font-weight: 650; }
    .kiosk-display {
      text-align: center; padding: 22px; border: 1px solid var(--line-strong); border-radius: var(--radius-md);
      background: rgba(255, 255, 255, .04); margin-bottom: 14px; letter-spacing: 14px; font-size: 34px; font-weight: 700;
      min-height: 84px; display: flex; align-items: center; justify-content: center; color: var(--faint);
    }
    .kiosk-display.filled { color: var(--ink); }
    .kiosk-result { text-align: center; padding: 30px; }
    .kiosk-result .name { font-size: 22px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }

    /* Kiosk stage — center content, no dead whitespace */
    .kiosk-stage { min-height: calc(100vh - 150px); display: flex; align-items: center; justify-content: center; padding: 8px 0; }
    .kiosk-stage .kiosk { width: 100%; max-width: 860px; }
    /* keypad input — keypad stays centered & fixed; student info floats on the right (keypad never moves) */
    .kiosk-input-stage { position: relative; }
    .kiosk-input-stage .keypad-card { width: 372px; }
    .kiosk-input-stage .kiosk-side { position: absolute; left: calc(50% + 202px); right: 24px; top: 50%; transform: translateY(-50%); }
    @media (max-width: 820px) {
      .kiosk-input-stage { flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 14px; }
      .kiosk-input-stage .keypad-card { width: 100%; max-width: 392px; }
      .kiosk-input-stage .kiosk-side { position: static; transform: none; left: auto; right: auto; width: 100%; max-width: 392px; margin-top: 14px; }
    }
    .keypad-head { text-align: center; margin-bottom: 16px; }
    .keypad-head .ic { font-size: 30px; }
    .keypad-head .t { font-weight: 750; font-size: 19px; margin-top: 6px; letter-spacing: -0.02em; }
    .keypad-head .s { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .kiosk-test { display: flex; align-items: center; justify-content: center; gap: 7px; color: var(--muted); font-size: 13px; }
    .kiosk-test b { padding: 4px 11px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-weight: 700; }
    .kiosk-hint { display: grid; place-items: center; gap: 10px; text-align: center; padding: 30px 22px; }
    .kiosk-hint .wave { font-size: 44px; animation: wave 1.8s var(--ease) infinite; transform-origin: 70% 80%; }
    @keyframes wave { 0%,60%,100%{transform:rotate(0)} 15%{transform:rotate(16deg)} 30%{transform:rotate(-8deg)} 45%{transform:rotate(12deg)} }
    .kiosk-hint .h { font-weight: 700; font-size: 16px; color: var(--ink); letter-spacing: -0.02em; }
    .kiosk-hint .test { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .kiosk-hint .test b { padding: 4px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; }

    /* Kiosk check-in celebration (gamified, kid-friendly) */
    .celebrate { width: 100%; max-width: 720px; margin: 0 auto; animation: popIn .5s var(--ease); }
    .hero-card { position: relative; overflow: hidden; border-radius: var(--radius-xl); padding: 30px 26px; text-align: center; color: #fff; background: linear-gradient(135deg, #fa4616 0%, #ff8a3d 100%); box-shadow: 0 20px 54px rgba(250, 70, 22, .38); }
    .hero-card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(440px 220px at 50% -40%, rgba(255, 255, 255, .4), transparent 70%); pointer-events: none; }
    .hero-emoji { font-size: 56px; line-height: 1; animation: bounce 1.5s var(--ease) infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .hero-hi { font-size: 30px; font-weight: 800; letter-spacing: -0.035em; margin-top: 8px; }
    .hero-sub { font-size: 14px; opacity: .94; margin-top: 6px; }
    .hero-chips { display: flex; gap: 9px; justify-content: center; margin-top: 18px; flex-wrap: wrap; position: relative; z-index: 1; }
    .hero-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; border-radius: 999px; background: rgba(255, 255, 255, .24); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font-weight: 700; font-size: 14px; }
    .hero-chip.pop { background: #fff; color: #d6360f; animation: chipPop .6s var(--ease) both .2s; }
    @keyframes chipPop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
    .lesson-big { font-size: 20px; font-weight: 750; letter-spacing: -0.02em; margin: 2px 0 2px; }
    .lesson-meta { color: var(--muted); font-size: 13px; }
    .mission-pill { display: inline-flex; align-items: center; gap: 7px; margin-top: 12px; padding: 9px 13px; border-radius: var(--radius-md); background: var(--brand-soft); border: 1px solid rgba(250, 70, 22, .26); color: var(--ink-soft); font-size: 13px; font-weight: 600; }
    .lvl-row { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 0; font-size: 12px; color: var(--muted); font-weight: 600; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 17px; background: var(--brand-soft); color: var(--brand); flex-shrink: 0; }
    .lb-row.me { background: var(--brand-soft); }
    .lb-row.me .lb-name { color: var(--brand); }
    /* keep the 3 stat cards in a row even on narrow kiosk/portrait so the top stays compact */
    .celebrate .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .celebrate .cols-3 .metric { min-height: 88px; padding: 14px; gap: 4px; }
    .celebrate .cols-3 .metric-value { font-size: 23px; }

    /* Kiosk check-in — landscape iPad optimized (single screen, two columns) */
    .celebrate-stage { min-height: calc(100vh - 110px); display: flex; align-items: center; justify-content: center; padding: 2px 0; }
    .celebrate-wide { width: 100%; max-width: 1060px; display: grid; grid-template-columns: 1.04fr .96fr; gap: 14px; animation: popIn .45s var(--ease); }
    .cel-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .hero-compact { display: flex; align-items: center; gap: 16px; text-align: left; padding: 18px 22px; }
    .hero-compact .hero-emoji { font-size: 44px; margin: 0; }
    .hero-compact .hero-hi { font-size: 23px; margin: 0; }
    .hero-compact .hero-sub { margin-top: 4px; font-size: 13px; }
    .pt-card { gap: 5px; min-height: 0; padding: 15px 16px; }
    .pt-card .metric-value { font-size: 27px; }
    .earn-badge { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; padding: 3px 9px; border-radius: 999px; background: rgba(48, 209, 88, .16); color: #4ade80; font-size: 12px; font-weight: 700; }

// ==================== UTILITIES ====================

function money(n) { return new Intl.NumberFormat("ko-KR").format(n) + "원"; }
function pct(n) { return Math.round(n) + "%"; }
function studentById(id) { return students.find(s => s.id === (id || state.selectedStudentId)) || students[0]; }
function classStudents(cid) { return students.filter(s => s.classId === (cid || state.selectedClassId)); }
function qualityScore(c) { return Math.round(c.attendance * .30 + c.reports * .25 + c.recordings * .25 + c.renewal * .20); }

// ===== 콘텐츠 사용량·정산 헬퍼 (1인당 단가 × 사용 학생 수 → 본사 운영비 30% / 제작자 70%) =====
function contentUsageFor(cid) { return contentUsage.filter(u => u.contentId === cid); }
function contentStudents(cid) { return contentUsageFor(cid).reduce((a, u) => a + u.students, 0); }
function contentCampuses(cid) { return contentUsageFor(cid).map(u => campusShort(u.campusId)).join(", ") || "-"; }
function campusShort(id) { return ((campuses.find(c => c.id === id) || {}).name || id).replace(/\s*(직영캠퍼스|캠퍼스|우수가맹|가맹)\s*/g, "").trim() || id; }
function contentGross(c) { return c.price * contentStudents(c.id); } // 콘텐츠 전체 사용료
// 한 캠퍼스가 사용한 콘텐츠별 청구 내역 [{content, students, gross}]
function campusContentBill(campusId) {
  return contentUsage.filter(u => u.campusId === campusId).map(u => {
    const c = contentPackages.find(x => x.id === u.contentId) || { price: 0 };
    return { content: c, students: u.students, gross: c.price * u.students };
  });
}
function campusContentTotal(campusId) { return campusContentBill(campusId).reduce((a, b) => a + b.gross, 0); }

const PUBLIC_GRADES = ["Verified", "Popular", "Signature"];
function isPublic(c) { return PUBLIC_GRADES.includes(c.status); }
function gradeBadge(g) { const m = GRADES[g] || { label: g, tag: "" }; return `<span class="tag ${m.tag}">${g} · ${m.label}</span>`; }
function contentCampusCount(cid) { return contentUsageFor(cid).length; }

function statusTag(status) {
  const map = {
    present: ["출석", "green"], scheduled: ["예정", ""], late: ["지각", "yellow"], absent: ["결석", "red"],
    "완료": ["완료", "green"], "대기": ["대기", "yellow"], "미납": ["미납", "red"],
    "확인 필요": ["확인 필요", "violet"], "승인": ["승인", "green"], "검수 대기": ["검수 대기", "yellow"], "수정 요청": ["수정 요청", "red"],
  };
  const m = map[status] || [status, ""];
  return `<span class="tag ${m[1]}">${m[0]}</span>`;
}

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text; el.classList.add("show");
  clearTimeout(window._tt);
  window._tt = setTimeout(() => el.classList.remove("show"), 2500);
}

function metric(label, value, note) {
  return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`;
}

function progressRing(pctVal, lvl) {
  const r = 50, c = 2 * Math.PI * r, offset = c - (pctVal / 100) * c;
  return `<div class="progress-ring"><svg width="120" height="120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="#fa4616" stroke-width="10" stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/></svg><div class="label"><div class="level">Lv.${lvl}</div><div class="sub">${pctVal}%</div></div></div>`;
}

function barChart(data, key, color) {
  const max = Math.max(...data.map(d => d[key]));
  return `<div class="bar-chart">${data.map(d => `<div class="bar-col"><div class="bar-value">${d[key]}</div><div class="bar ${color}" style="height:${(d[key]/max)*100}%"></div><div class="bar-label">${d.week}</div></div>`).join("")}</div>`;
}

function heatmapMonth() {
  const cells = [];
  for (let i = 0; i < 3; i++) cells.push('<div class="heatmap-cell empty"></div>');
  for (let d = 1; d <= 28; d++) {
    const lvl = d % 7 === 0 ? "" : d % 3 === 0 ? "l1" : d % 5 === 0 ? "l3" : "l2";
    cells.push(`<div class="heatmap-cell ${lvl}"></div>`);
  }
  return `<div class="heatmap">${cells.join("")}</div><div class="heatmap-legend"><span style="background:var(--line)"></span>없음 <span style="background:rgba(48,209,88,0.3)"></span>1회 <span style="background:rgba(48,209,88,0.55)"></span>2회 <span style="background:#30d158"></span>3회+ </div>`;
}

// ==================== NAVIGATION ====================

function selectRole(roleId) {
  const role = roles.find(r => r.id === roleId);
  state.role = roleId;
  state.view = role.default;
  saveState();
  renderApp();
}

function switchRole() {
  state.role = null;
  state.view = null;
  saveState();
  renderApp();
}

function showView(viewId) {
  state.view = viewId;
  saveState();
  renderApp();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ==================== RENDER ====================

function renderApp() {
  const roleScreen = document.getElementById("roleScreen");
  const appShell = document.getElementById("appShell");

  if (!state.role) {
    roleScreen.classList.remove("hidden");
    appShell.classList.add("hidden");
    renderRoleSelect();
    return;
  }

  roleScreen.classList.add("hidden");
  appShell.classList.remove("hidden");
  appShell.classList.toggle("kiosk-mode", state.view === "student-kiosk");
  renderNav();
  renderShell();
  renderView();
}

function renderRoleSelect() {
  document.getElementById("roleGrid").innerHTML = roles.map(r =>
    `<div class="role-card" onclick="selectRole('${r.id}')">
      <div class="role-icon">${r.icon}</div>
      <div class="role-card-title">${r.label}</div>
      <div class="role-card-desc">${r.desc}</div>
    </div>`
  ).join("");
}

function renderNav() {
  const items = navConfig[state.role] || [];
  document.getElementById("roleBadge").textContent = (roles.find(r => r.id === state.role) || {}).label || "";
  document.getElementById("nav").innerHTML = items.map(([id, label, icon]) =>
    `<button class="nav-btn ${state.view === id ? "active" : ""}" onclick="showView('${id}')"><span class="nav-icon">${icon}</span><span>${label}</span></button>`
  ).join("");
}

function renderShell() {
  const items = navConfig[state.role] || [];
  const item = items.find(n => n[0] === state.view) || items[0] || ["", "D.LAB ONE", ""];
  document.getElementById("pageTitle").textContent = item[1];
  document.getElementById("pageCopy").textContent = "";
  const kioskExit = state.view === "student-kiosk" ? `<button class="btn" onclick="switchRole()">&#x21C4; 역할 전환</button>` : "";
  document.getElementById("topToolbar").innerHTML = `${kioskExit}<button class="btn" onclick="resetDemo()">&#x1F504; 데모 초기화</button>`;
}

function renderView() {
  const container = document.getElementById("viewContainer");
  const fn = viewRenderers[state.view];
  container.innerHTML = fn ? fn() : `<div class="panel pad"><p>준비 중인 화면입니다.</p></div>`;
}

// ==================== ACTIONS ====================

function setDigits(v) {
  if (v === "back") state.digits = state.digits.slice(0, -1);
  else if (v === "clear") state.digits = "";
  else if (state.digits.length < 4) state.digits += v;
  saveState(); renderView();
}

function checkIn(sid) {
  const s = students.find(x => x.id === sid);
  // 출석 보상: 누적 포인트(랭킹·레벨)와 사용 가능 포인트(상점) 모두 +30
  if (s) { s.status = "present"; s.points += 30; s.balance = (s.balance || 0) + 30; }
  state.checkedIn = true;
  state.selectedStudentId = sid;
  state.digits = "";
  saveState(); renderView();
  toast(`${s.name} 학생 출석 완료! 학부모 알림이 발송되었습니다.`);
}

function buyReward(itemId) {
  const item = shopItems.find(i => i.id === itemId);
  const s = studentById();
  if (!item || !s) return;
  if ((s.balance || 0) < item.cost) { toast("사용 가능 포인트가 부족해요."); return; }
  // 사용 가능 포인트만 차감 — 누적 포인트(랭킹)는 그대로 유지
  s.balance -= item.cost;
  saveState(); renderView();
  toast(`${item.name} 교환 완료! 사용 가능 포인트 ${s.balance}P`);
}

function toggleRecording() {
  state.recording = !state.recording;
  if (!state.recording) state.recordingDone = true;
  saveState(); renderView();
  toast(state.recording ? "녹음을 시작합니다." : "녹음 종료 - AI 리포트를 생성합니다.");
}

function sendReports() {
  state.reportsSent = true;
  saveState(); renderView();
  toast("학부모 리포트가 발송되었습니다.");
}

// 선구매가 아니라 사용량 기반 후정산: 도입하면 학생 사용분이 월말에 자동 청구된다.
function adoptContent(cid) {
  const c = contentPackages.find(x => x.id === cid) || {};
  toast(`${c.title} 도입 완료 — 학생이 사용한 만큼 월말에 자동 정산됩니다.`);
}

function resetDemo() {
  students.forEach(s => { s.status = "scheduled"; s.points = [620,480,310,750,410,550,200,880][students.indexOf(s)]; });
  state = { ...defaultState, role: state.role, view: state.view };
  saveState(); renderApp();
  toast("데모가 초기화되었습니다.");
}

function toggleNotif(nid) {
  state.expandedNotif = state.expandedNotif === nid ? null : nid;
  saveState(); renderView();
}

function approveContent(cid, newStatus) {
  const c = contentPackages.find(x => x.id === cid);
  if (c) c.status = newStatus;
  saveState(); renderView();
  const label = (GRADES[newStatus] || {}).label || newStatus;
  toast(`${c.title} → ${newStatus}(${label}) 처리되었습니다.`);
}

// 내가 만든 콘텐츠 — Draft~Signature 상태 확인 + 검토요청/재제출 + 수익(70%)
viewRenderers["market-mine"] = () => {
  const mine = contentPackages.filter(c => c.creator.includes("이수진") || c.creator.includes("분당"));
  const liveMine = mine.filter(isPublic);
  const earnings = liveMine.reduce((a, c) => a + contentGross(c) * CREATOR_RATE, 0);
  const action = c => {
    if (c.status === "Draft") return `<button class="btn sm primary" onclick="approveContent('${c.id}','Review')">검토 요청</button>`;
    if (c.status === "Revision") return `<button class="btn sm primary" onclick="approveContent('${c.id}','Review')">수정 후 재제출</button>`;
    if (c.status === "Rejected") return `<button class="btn sm" onclick="toast('반려 사유를 확인하세요.')">반려 사유</button>`;
    if (c.status === "Review") return `<span class="row-copy">본사 검수 대기 중</span>`;
    return `<button class="btn sm" onclick="state.selectedContentId='${c.id}';saveState();showView('market-detail');">상세</button>`;
  };
  return `<div class="grid cols-4">
    ${metric("등록 콘텐츠", `${mine.length}개`, `공개 ${liveMine.length} · 검토중 ${mine.filter(c=>!isPublic(c)).length}`)}
    ${metric("총 수강 학생", `${mine.reduce((a,c)=>a+contentStudents(c.id),0)}명`, "공개 콘텐츠 합산")}
    ${metric("이번 달 수익(70%)", money(earnings), "사용량 기반")}
    ${metric("누적 수익", money(earnings * 3), "최근 3개월")}
  </div>
  <div class="panel" style="margin-top:14px;">
    <div class="panel-head"><div><h2 class="panel-title">내 콘텐츠 상태</h2><p class="panel-sub">Draft는 검토 요청 시 본사 검수로 넘어갑니다</p></div><button class="btn primary sm" onclick="showView('market-register')">+ 새 콘텐츠</button></div>
    <div class="table-wrap"><table>
      <thead><tr><th>콘텐츠</th><th>등급</th><th>수강/캠퍼스</th><th>1인 단가</th><th>내 수익(70%)</th><th>관리</th></tr></thead>
      <tbody>${mine.map(c => `<tr>
        <td style="font-weight:800;">${c.title}</td><td>${gradeBadge(c.status)}</td><td>${contentStudents(c.id)}명 / ${contentCampusCount(c.id)}곳</td><td>${money(c.price)}</td>
        <td style="font-weight:900;color:var(--green);">${isPublic(c) ? money(contentGross(c) * CREATOR_RATE) : "-"}</td><td>${action(c)}</td></tr>`).join("")}</tbody>
    </table></div>
  </div>`;
};

    ${bill.map(b => `<div class="row-card"><div class="row-top"><div><div class="row-title">${b.content.title} ${gradeBadge(b.content.status)}</div><div class="row-copy">${b.content.creator} &middot; 학생 ${b.students}명 사용 &middot; 청구 ${money(b.gross)}</div></div>
      <div style="display:flex;gap:6px;"><button class="btn sm" onclick="toast('수업 자료를 엽니다 (DRM 보호).')">자료 열람</button><button class="btn sm primary" onclick="showView('market-usage')">사용 등록</button></div></div></div>`).join("")}

};

  const bill = campusContentBill(campusId);
  return `<div class="grid cols-2">
    <div class="panel pad">
      <div style="font-weight:900;margin-bottom:14px;">수업 사용 등록</div>
      <div style="display:grid;gap:12px;">
        <div><label style="font-weight:800;font-size:13px;display:block;margin-bottom:6px;">콘텐츠</label><select class="select" style="width:100%;">${contentPackages.filter(isPublic).map(c=>`<option>${c.title}</option>`).join("")}</select></div>
        <div class="grid cols-2">
          <div><label style="font-weight:800;font-size:13px;display:block;margin-bottom:6px;">반</label><select class="select" style="width:100%;">${classes.filter(x=>x.campusId===campusId).map(x=>`<option>${x.name}</option>`).join("")}</select></div>
          <div><label style="font-weight:800;font-size:13px;display:block;margin-bottom:6px;">수업 날짜</label><input class="input" type="date" value="2026-05-30"></div>

        <div class="grid cols-2">

          <div><label style="font-weight:800;font-size:13px;display:block;margin-bottom:6px;">실제 수강 학생 수</label><input class="input" type="number" placeholder="12"></div>
        </div>
        <div><label style="font-weight:800;font-size:13px;display:block;margin-bottom:6px;">강사 후기 / 결과물 메모</label><textarea class="textarea" placeholder="수업 운영 팁, 학생 결과물, 만족도 등"></textarea></div>
        <div style="font-size:12px;color:var(--muted);">입력한 수강 학생 수가 정산·등급 평가에 누적 반영됩니다. (출결 데이터와 교차 검증)</div>
        <button class="btn primary" onclick="toast('수업 사용이 등록되었습니다. 학생 수가 누적됩니다.')">사용 등록</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2 class="panel-title">최근 사용 기록</h2><p class="panel-sub">${campusShort(campusId)}캠퍼스 누적</p></div></div>
      <div class="table-wrap"><table><thead><tr><th>콘텐츠</th><th>누적 학생</th><th>청구액</th></tr></thead>
        <tbody>${bill.map(b => `<tr><td style="font-weight:800;">${b.content.title}</td><td>${b.students}명</td><td>${money(b.gross)}</td></tr>`).join("")}
        <tr><td style="text-align:right;font-weight:800;">합계</td><td>${bill.reduce((a,b)=>a+b.students,0)}명</td><td style="font-weight:900;color:var(--brand);">${money(campusContentTotal(campusId))}</td></tr></tbody>
      </table></div>
    </div>
  </div>`;
};

viewRenderers["market-settlement"] = () => {
  return `<div class="grid cols-3">
    ${metric("이번 달 정산", money(contentPackages.filter(isPublic).reduce((a,c)=>a+c.price*contentStudents(c.id),0)), "전체 콘텐츠 거래")}
    ${metric("본사 운영비 (30%)", money(contentPackages.filter(isPublic).reduce((a,c)=>a+c.price*contentStudents(c.id)*.3,0)), "")}
    ${metric("제작자 정산 (70%)", money(contentPackages.filter(isPublic).reduce((a,c)=>a+c.price*contentStudents(c.id)*.7,0)), "")}
  </div>
  <div class="panel" style="margin-top:14px;">
    <div class="panel-head"><div><h2 class="panel-title">정산 상세</h2></div>
      <div style="display:flex;gap:8px;"><button class="btn sm" onclick="toast('Excel 내보내기')">Excel</button><button class="btn sm" onclick="toast('PDF 내보내기')">PDF</button><button class="btn sm" onclick="toast('세금계산서 발행 화면으로 이동합니다.')">세금계산서 발행</button></div>

    <div class="table-wrap"><table>

      <tbody>${contentPackages.filter(isPublic).flatMap(c => contentUsageFor(c.id).map(u => {
        const g = c.price * u.students;
        return `<tr><td style="font-weight:800;">${c.title}</td><td>${campusShort(u.campusId)}</td><td>${u.students}명</td><td>${money(c.price)}</td><td style="font-weight:800;">${money(g)}</td><td>${money(g*HQ_RATE)}</td><td style="color:var(--green);">${money(g*CREATOR_RATE)}</td><td><button class="btn sm" onclick="toast('세금계산서 발행 완료')">발행</button></td></tr>`;
      })).join("")}</tbody>
    </table></div>
  </div>`;
};
